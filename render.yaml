services:
  - type: web
    name: dilfer-rg
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dilfer-rg-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: NODE_ENV
        value: production

databases:
  - name: dilfer-rg-db
    region: oregon
    plan: starter
